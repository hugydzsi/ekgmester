<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKG Mester - AI Oktató</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 32px;
            border: 0.5px solid #e0e0d0;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 500;
            color: #000;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .level-select {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .level-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            border: 0.5px solid #e0e0d0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #000;
            transition: all 0.2s;
        }

        .level-btn:hover {
            border-color: #999;
            background: #f9f9f6;
        }

        .level-btn.active {
            background: #378ADD;
            color: white;
            border-color: #378ADD;
        }

        .quiz-container {
            display: none;
        }

        .quiz-container.active {
            display: block;
        }

        .progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
            color: #666;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: #e0e0d0;
            border-radius: 2px;
            margin: 0 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #378ADD;
            width: 0%;
            transition: width 0.3s;
        }

        .situation {
            background: #f9f9f6;
            border: 0.5px solid #e0e0d0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .situation h3 {
            font-size: 13px;
            font-weight: 500;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .situation-text {
            font-size: 15px;
            line-height: 1.6;
            color: #000;
            margin-bottom: 16px;
        }

        .ekg-display {
            background: white;
            border: 0.5px solid #e0e0d0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            font-family: "Courier New", monospace;
            font-size: 12px;
            color: #d4524c;
            line-height: 1.4;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #000;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 0.5px solid #e0e0d0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            background: white;
            color: #000;
        }

        textarea:focus {
            outline: none;
            border-color: #378ADD;
            box-shadow: 0 0 0 2px rgba(55, 138, 221, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: 0.5px solid #e0e0d0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #000;
            transition: all 0.2s;
        }

        button:hover {
            background: #f9f9f6;
            border-color: #999;
        }
